#jdbc.driver=com.mysql.cj.jdbc.Driver
#jdbc.url=jdbc:mysql://127.0.0.1:3306/scoula_db
jdbc.driver=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
jdbc.url=jdbc:log4jdbc:mysql://localhost:3306/scoula_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
jdbc.username=scoula
jdbc.password=1234
gemini.api.key=${GEMINI_API_KEY}

# Password reset mail (Gmail SMTP)
# MAIL_USERNAME : sender gmail address
# MAIL_PASSWORD : Gmail app password (16 chars, NOT the login password. requires 2-step verification)
# Read from environment variables, same as gemini.api.key.
# Do NOT write real values here - this file is committed to GitHub.
# If the variables are missing, the code is printed to the server log instead of being mailed.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.username=${MAIL_USERNAME:}
mail.password=${MAIL_PASSWORD:}